name: Daily HR tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * 3-10 *"
    - cron: "0 11 * 3-10 *"

permissions:
  contents: write

jobs:
  build-or-settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build today's daily file
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * 3-10 *'
        run: python scripts/build_daily_model.py
      - name: Settle yesterday's calls
        if: github.event.schedule == '0 11 * 3-10 *'
        run: python scripts/settle_results.py
      - name: Commit generated tracker data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update HR tracker data"
          git push
